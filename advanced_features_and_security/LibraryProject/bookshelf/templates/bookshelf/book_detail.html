<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }}</title>
</head>
<body>
    <h1>{{ book.title }}</h1>
    <p><strong>Author:</strong> {{ book.author }}</p>
    <p><strong>ISBN:</strong> {{ book.isbn }}</p>
    <p><strong>Published:</strong> {{ book.published_date }}</p>
    
    <!-- ALX Security: Auto-escaping prevents XSS -->
    <h3>Description:</h3>
    <p>{{ book.description|linebreaks }}</p>
    
    <p><small>Note: Django template auto-escaping prevents XSS attacks</small></p>
    
    <a href="{% url 'book_list' %}">Back to Book List</a>
</body>
</html>
