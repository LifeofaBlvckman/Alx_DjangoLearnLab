{% extends "blog/base.html" %}

{% block title %}Home - Django Blog{% endblock %}

{% block content %}
<div class="container">
    <div class="jumbotron">
        <h1 class="display-4">Welcome to Django Blog!</h1>
        <p class="lead">A simple blog built with Django.</p>
        <hr class="my-4">
        <p>Check out our latest posts below or create your own!</p>
        <a class="btn btn-primary btn-lg" href="{% url 'post-list' %}" role="button">View All Posts</a>
    </div>
</div>
{% endblock %}
