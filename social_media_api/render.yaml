services:
  - type: web
    name: social-media-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn social_media_api.wsgi:application --config gunicorn.conf.py"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: social-media-api.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: social-media-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: true

databases:
  - name: social-media-db
    plan: free
    databaseName: social_media_db
    user: social_media_user
